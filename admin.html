<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — PINTS</title>
<meta name="description" content="Organizer tools for PINTS.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>Admin console</h1>
  <div id="guard" class="msg warn">Checking your permissions…</div>
  <div id="console" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="abstracts" aria-selected="true">Abstracts</button>
      <button role="tab" data-tab="schedule" aria-selected="false">Schedule</button>
      <button role="tab" data-tab="pages" aria-selected="false">Pages</button>
      <button role="tab" data-tab="participants" aria-selected="false">Participants</button>
      <button role="tab" data-tab="voting" aria-selected="false">Voting</button>
      <button role="tab" data-tab="hero" aria-selected="false">Home photos</button>
      <button role="tab" data-tab="archive" aria-selected="false">Archive</button>
      <button role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </div>
    <section id="panel-abstracts" role="tabpanel"></section>
    <section id="panel-schedule" role="tabpanel" hidden></section>
    <section id="panel-pages" role="tabpanel" hidden></section>
    <section id="panel-participants" role="tabpanel" hidden></section>
    <section id="panel-voting" role="tabpanel" hidden></section>
    <section id="panel-hero" role="tabpanel" hidden></section>
    <section id="panel-archive" role="tabpanel" hidden></section>
    <section id="panel-settings" role="tabpanel" hidden></section>
  </div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/page-admin.js"></script>
</body>
</html>
