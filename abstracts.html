<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abstracts — PINTS</title>
<meta name="description" content="Accepted talk and poster abstracts for PINTS.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
  <h1>Abstracts</h1>
  <div id="guidelines" class="prose" data-markdown="content/poster-guidelines.md" data-page="poster-guidelines"></div>
  <div id="submit-panel">
    <div id="submit-cta-block">
      <p id="submit-intro">Browse the accepted abstracts below, and submit a poster
        abstract of your own — create one if you have not already.</p>
      <p class="actions"><a class="button" id="submit-cta" href="submit.html">Submit an abstract</a></p>
    </div>
    <div id="my-abstract"></div>
  </div>
  <p id="vote-banner" class="msg ok vote-banner" hidden></p>
  <p id="filters">
    <label for="q">Search
      <span class="hint">Matches titles, authors, affiliations, and abstract text.</span>
    </label>
    <input id="q" type="text" autocomplete="off">
    <label for="topic">Topic</label>
    <select id="topic"></select>
  </p>
  <p id="count" class="muted"></p>
  <div id="msg" class="msg" role="status" aria-live="polite"></div>
  <div id="list"></div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/page-abstracts.js"></script>
</body>
</html>
