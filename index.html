<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PINTS — Paris Île-de-France Neuroscience, Theory, and Systems</title>
<meta name="description" content="PINTS is a one-day meeting bringing together the Paris Île-de-France neuroscience, theory, and systems community.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="site-header"></header>
<section class="hero">
  <!-- Filled by js/hero-slider.js, and left empty when no photographs are set.
       aria-hidden because they are decoration: the logo's alt already says what
       this band is, and a screen reader gains nothing from hearing a
       photograph described behind it. -->
  <div class="hero-photos" id="hero-photos" aria-hidden="true"></div>
  <!-- The whole band is the way to the Archive, where these photographs are the
       point rather than a tint. Revealed by js/page-content.js only once the
       slider has actually mounted something: on a hero with no photographs there
       is nothing to see more of, and a plain burgundy band that navigates when
       you click it is just a trap.

       Before .wrap in the markup on purpose. Both carry z-index 1, so the later
       one paints on top -- which is what keeps the three buttons above this and
       clickable while everything around them falls through to it.

       The chip inside it is a label, not a second link. Two anchors pointing at
       the same page would be two tab stops and two announcements of the same
       thing; this way the band is one target that happens to say what it does. -->
  <a class="hero-link" id="hero-link" href="previous.html" hidden>
    <span class="hero-credit">More photographs in the Archive<span aria-hidden="true"> →</span></span>
  </a>
  <div class="wrap">
    <h1><img class="logo" src="assets/pints-2026-header.svg" width="522" height="107"
      alt="PINTS 2026 — Paris Île-de-France Neuroscience, Theory, and Systems. November 6th, 2026, Daniel Cohen Amphitheater, ENS, 48 Bd Jourdan, 75014 Paris"></h1>
    <!-- vote-cta: shown by js/page-content.js only while config/site.votingOpen. -->
    <div class="actions"><a class="button" id="vote-cta" href="vote.html" hidden>Vote for the best poster</a>
      <a class="button" id="submit-cta" href="submit.html">Submit an abstract</a>
      <a class="button secondary" id="register-cta" href="register.html">Register</a>
      <a class="button secondary" href="program.html">See the program</a>
      <a class="button secondary" href="contact.html">Contact us</a>
      <!-- Wired up by js/page-content.js from js/config.mjs's EVENT constant.
           Reuses the .nav-dropdown/-menu/-panel classes the account menu in
           js/layout.js already defines, so this looks like the same control
           rather than a one-off. -->
      <span class="nav-dropdown" id="add-to-calendar">
        <button type="button" class="button secondary" aria-expanded="false">Add to calendar ▾</button>
        <div class="nav-dropdown-menu">
          <div class="nav-dropdown-panel">
            <a id="calendar-google" target="_blank" rel="noopener">Google Calendar</a>
            <a id="calendar-outlook" target="_blank" rel="noopener">Outlook.com</a>
            <a href="#" id="calendar-ics">Apple / other (.ics)</a>
          </div>
        </div>
      </span></div>
  </div>
</section>
<main class="wrap">
  <div class="prose" data-markdown="content/home.md" data-page="home"></div>
</main>
<footer id="site-footer"></footer>
<script type="module" src="js/page-content.js"></script>
</body>
</html>
